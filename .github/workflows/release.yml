name: Release

on:
  push:
    branches: [master]

# Two releases running at once would race on the version commit.
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # changesets needs history to work out what has already shipped.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # @changesets/cli requires ^22.11 || ^24. This is the Node that runs
          # the release tooling only - the support matrix users get is set by
          # engines in package.json and exercised by the CI test matrix.
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # A missing secret otherwise surfaces as an E403 from the registry after a
      # successful build, which reads like an npm permissions problem. The
      # fallback it triggers cannot work for a first release: npm only allows a
      # trusted publisher to be configured once the package already exists.
      - name: Require an npm token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      # With changesets pending this opens a "Version Packages" PR. Merging that
      # PR runs this workflow again, finds no changesets, and publishes instead.
      - uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # changesets/action looks for NPM_TOKEN specifically to decide whether
          # to authenticate with a token; without it, it falls back to OIDC.
          # NODE_AUTH_TOKEN is what the .npmrc written by setup-node reads.
          # Both are needed - the first chooses the path, the second authorises.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
