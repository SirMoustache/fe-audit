name: Release

on:
  push:
    branches: [master]

# Two releases running at once would race on the version commit.
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # changesets needs history to work out what has already shipped.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Node 24 for the npm it bundles: trusted publishing needs npm 11.5.1
          # or newer, and Node 22 still ships npm 10.9. This is the Node that
          # runs the release tooling only - what users get is set by engines in
          # package.json and exercised by the CI test matrix.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Publishing is authorised by OIDC against the trusted publisher
      # configured on npm, so there is no token to check. An npm too old for
      # trusted publishing instead fails as a bare E403 from the registry,
      # which reads like a permissions problem and says nothing about versions.
      - name: Require an npm that supports trusted publishing
        run: |
          npm --version
          node -e "const s=require('semver');const v=require('child_process').execSync('npm --version').toString().trim();if(!s.gte(v,'11.5.1')){console.error('::error::npm '+v+' cannot publish via OIDC; 11.5.1 or newer is required');process.exit(1)}"

      # With changesets pending this opens a "Version Packages" PR. Merging that
      # PR runs this workflow again, finds no changesets, and publishes instead.
      - uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: its absence is what makes changesets/action take the
          # OIDC path. Adding one back would silently switch to token auth.
          NPM_CONFIG_PROVENANCE: true
