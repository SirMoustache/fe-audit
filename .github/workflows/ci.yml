name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The published artefact is dist/, so prove the compiled CLI runs.
      - name: Smoke-test the CLI
        run: node dist/cli.js --help

  changeset:
    # A user-visible change with no changeset silently ships undocumented, which
    # is how a changelog drifts from what actually happened.
    #
    # Skipped on the release branch: changesets/action opens that PR by deleting
    # every changeset file, so this check would exit 1 on the one PR that must
    # merge for a release to happen. Verified - `changeset status` with nothing
    # pending exits 1.
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref != 'changeset-release/master'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Must satisfy @changesets/cli's engines, same as release.yml.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check for a changeset
        run: npx changeset status --since=origin/${{ github.base_ref }}
